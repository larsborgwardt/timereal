name: Abhängigkeiten wöchentlich prüfen
# Neue Sicherheitsmeldungen erscheinen auch ohne Codeänderung.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Bekannte Schwachstellen in Abhängigkeiten prüfen
        run: npm audit --audit-level=moderate
