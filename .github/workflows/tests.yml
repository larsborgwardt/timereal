name: Timereal prüfen
on:
  push:
    branches: [main, feature/zeiterfassung-lxc]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kapazitaet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 100 gleichzeitige Nutzer mit gewachsenem Datenbestand
        run: bash tests/last.sh
        env:
          LAST_AUSGABE: /tmp/timereal-lastnachweis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kapazitaet-100-nutzer
          path: |
            /tmp/timereal-lastnachweis/ergebnis.json
            /tmp/timereal-lastnachweis/ressourcen-*.jsonl
            /tmp/timereal-lastnachweis/server.log
          retention-days: 14
  pruefung:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python für unabhängige Excel-Dateiprüfung
        run: python3 --version
      - run: npx playwright-core install --with-deps chromium
      - name: Edge-Upload-Paket bauen und prüfen
        run: |
          node --test tests/erweiterung-paket.test.mjs
          node scripts/erweiterung-bauen.mjs --target edge-store --zip
          node tests/erweiterung-store-browser.mjs
      - name: Datenbank, API, Browser und Erweiterung prüfen
        run: npm test
        env:
          POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
          BROWSER_TEST: '1'
          SCREENSHOT_DIR: screenshots
      - name: Betriebsskripte prüfen
        run: |
          for script in betrieb/*.sh tests/betrieb-ausgabe*.sh tests/betrieb-proxy.sh; do
            bash -n "$script" || exit
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sichtnachweise-pg${{ matrix.postgres }}
          path: screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.postgres == 18
        with:
          name: timereal-erweiterung
          path: dist/erweiterung/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.postgres == 18
        with:
          name: timereal-edge-store
          path: |
            dist/timereal-erweiterung-*-edge-store.zip
            dist/timereal-erweiterung-*-edge-store.zip.sha256
          if-no-files-found: error
