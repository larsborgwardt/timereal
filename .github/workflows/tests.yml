name: Timereal prüfen
on:
  push:
    branches: [main, feature/zeiterfassung-lxc]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-und-abhaengigkeiten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Formatierung des Programmcodes prüfen
        run: npx prettier --check src web betrieb tests scripts erweiterung .github
      - name: Bekannte Schwachstellen in Abhängigkeiten prüfen
        run: npm audit --audit-level=moderate
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks 8.30.1 mit geprüfter Downloadsumme bereitstellen
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Gegenprobe und Git-Historie auf Geheimnisse prüfen
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" bash tests/gitleaks.sh
  pruefung:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python für unabhängige Excel-Dateiprüfung
        run: python3 --version
      - run: npx playwright-core install --with-deps chromium
      - name: Edge-Upload-Paket bauen und prüfen
        run: |
          node --test tests/erweiterung-paket.test.mjs
          node scripts/erweiterung-bauen.mjs --target edge-store --zip
          node tests/erweiterung-store-browser.mjs
      - name: Datenbank, API, Browser und Erweiterung prüfen
        run: npm test
        env:
          POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
          BROWSER_TEST: "1"
          SCREENSHOT_DIR: screenshots
      - name: Betriebsskripte prüfen
        run: |
          for script in betrieb/*.sh tests/betrieb-ausgabe*.sh tests/betrieb-proxy.sh; do
            bash -n "$script" || exit
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sichtnachweise-pg${{ matrix.postgres }}
          path: screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.postgres == 18
        with:
          name: timereal-erweiterung
          path: dist/erweiterung/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.postgres == 18
        with:
          name: timereal-edge-store
          path: |
            dist/timereal-erweiterung-*-edge-store.zip
            dist/timereal-erweiterung-*-edge-store.zip.sha256
          if-no-files-found: error
